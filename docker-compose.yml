version: '3.8'

services:

  # API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud_detection_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./reports:/app/reports
    env_file:
      - .env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - fraud_detection_network

  # Dashboard Service
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud_detection_dashboard
    ports:
      - "8050:8050"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    env_file:
      - .env
    environment:
      - DASH_HOST=0.0.0.0
      - DASH_PORT=8050
    command: python dash_interface.py
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - fraud_detection_network

  # Optional: PostgreSQL Database
  # postgres:
  #   image: postgres:14-alpine
  #   container_name: fraud_detection_db
  #   environment:
  #     POSTGRES_USER: fraud_user
  #     POSTGRES_PASSWORD: fraud_password
  #     POSTGRES_DB: fraud_detection
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - fraud_detection_network

networks:
  fraud_detection_network:
    driver: bridge

volumes:
  postgres_data: